<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DinoWorld: enciclopedia digital de dinosaurios con datos de DinoFYI.">
  <title>Explorador · DinoWorld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="visually-hidden" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html">DinoWorld</a>
      <nav aria-label="Principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="explorer.html" aria-current="page">Explorador</a></li>
          <li><a href="periods.html">Épocas</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenido">
    <h1>Explorador de dinosaurios</h1>
    <p class="lead">De los más famosos a los menos conocidos. Busca por nombre o sigue explorando el catálogo.</p>
    <nav class="tabs" id="tabs" aria-label="Recursos de la API"></nav>
    <form class="search" id="search-form" role="search">
      <label class="visually-hidden" for="q">Buscar dinosaurio</label>
      <input id="q" type="search" placeholder="Busca por nombre: raptor, rex, saurus…">
      <button class="btn" type="submit">Buscar</button>
    </form>
    <div id="status" aria-live="polite"></div>
    <ul class="grid" id="results"></ul>
    <p><button class="btn btn--ghost" id="more" type="button" hidden>Cargar más</button></p>
  </main>
  <dialog class="detail" id="detail" aria-label="Detalle">
    <button class="btn btn--ghost detail__close" type="button" aria-label="Cerrar">✕</button>
    <div class="detail__body"></div>
  </dialog>
  <footer class="site-footer">
    <p>Actividad Práctica 24 Datos: <a href="https://dinofyi.com/developers/">DinoFYI API</a> · Proyecto del módulo AJAX y APIs</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/explorer.js"></script>
</body>
</html>
